# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
  branches:
    include:
      - main

pr: none

variables:
  buildConfiguration: Release
  nodeVersion: 24.x
  dotnetVersion: 9.x
  azureServiceConnection: restoreapp-azure-service-connection
  azureWebAppName: restoreapp

stages:
  - stage: Build
    displayName: Build application

    jobs:
      - job: Build
        displayName: Build React and ASP.NET Core
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Install Node.js
            inputs:
              version: $(nodeVersion)

          - script: npm ci
            displayName: Install client dependencies
            workingDirectory: Restore/client-project

          - script: npm run build
            displayName: Build React client
            workingDirectory: Restore/client-project

          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: Build API
            inputs:
              command: build
              projects: Restore/API/API.csproj
              arguments: --configuration $(buildConfiguration)

          - task: DotNetCoreCLI@2
            displayName: Publish API
            inputs:
              command: publish
              publishWebProjects: false
              projects: Restore/API/API.csproj
              arguments: >-
                --configuration $(buildConfiguration)
                --no-build
                --output $(Build.ArtifactStagingDirectory)/publish
              zipAfterPublish: true
              modifyOutputPath: false

          - task: PublishPipelineArtifact@1
            displayName: Publish deployment artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifactName: restoreapp
              publishLocation: pipeline

  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: Deploy
        displayName: Deploy Restore App
        environment: restoreapp-production
        pool:
          vmImage: ubuntu-latest

        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: restoreapp

                - task: AzureWebApp@1
                  displayName: Deploy Azure App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webApp
                    appName: $(azureWebAppName)
                    package: $(Pipeline.Workspace)/restoreapp/**/*.zip
